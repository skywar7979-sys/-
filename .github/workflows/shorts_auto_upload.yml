name: Shorts auto upload

on:
  schedule:
    # 09:00 KST daily
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shorts-auto-uploader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore platform credentials
        run: |
          mkdir -p config
          if [ -n "${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}" ]; then
            echo "${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}" > config/youtube_client_secret.json
          fi
          if [ -n "${{ secrets.YOUTUBE_TOKEN_JSON }}" ]; then
            echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" > config/youtube_token.json
          fi

      - name: Publish next queued short
        env:
          PLATFORMS: ${{ vars.PLATFORMS }}
          YOUTUBE_CLIENT_SECRET_FILE: config/youtube_client_secret.json
          YOUTUBE_TOKEN_FILE: config/youtube_token.json
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_VIDEO_HOST_UPLOAD_URL: ${{ secrets.PUBLIC_VIDEO_HOST_UPLOAD_URL }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
        run: python -m src.main run

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: record published short [skip ci]"
          git push
