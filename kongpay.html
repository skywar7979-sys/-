<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>콩페이</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --kp-bg:#F4F5F8;
    --kp-surface:#FFFFFF;
    --kp-primary:#4B39EF;
    --kp-primary-dark:#392BC4;
    --kp-mint:#00CDA8;
    --kp-coral:#FF5B5B;
    --kp-text:#191B23;
    --kp-text-sub:#8A8FA3;
    --kp-text-faint:#C2C5D1;
    --kp-line:#EEEFF3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:#E9EAF0; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;}
  body{display:flex; justify-content:center; padding:32px 12px; min-height:100vh;}

  .phone{
    width:390px; max-width:100%;
    background:var(--kp-bg);
    border-radius:40px;
    box-shadow:0 30px 60px rgba(20,20,40,0.25), 0 0 0 10px #101018;
    overflow:hidden;
    position:relative;
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:24px; background:#101018; border-radius:0 0 16px 16px; z-index:20;
  }
  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 24px 4px; font-size:13px; font-weight:600; color:var(--kp-text);
  }
  .screen{ min-height:780px; padding-bottom:90px; position:relative;}

  /* header */
  .app-header{ display:flex; justify-content:space-between; align-items:center; padding:10px 20px 4px;}
  .greet{ font-size:19px; font-weight:600; color:var(--kp-text); letter-spacing:-0.3px;}
  .greet span{ color:var(--kp-primary);}
  .icon-btn{ width:36px; height:36px; border-radius:50%; background:var(--kp-surface); display:flex; align-items:center; justify-content:center; color:var(--kp-text-sub); border:none; position:relative;}
  .dot{ position:absolute; top:8px; right:8px; width:6px; height:6px; border-radius:50%; background:var(--kp-coral);}

  /* balance card */
  .balance-card{
    margin:14px 20px 0; background:var(--kp-primary); border-radius:20px; padding:22px 22px 20px;
    color:#fff; position:relative; overflow:hidden;
  }
  .balance-card::after{
    content:""; position:absolute; right:-30px; top:-40px; width:140px; height:140px;
    background:var(--kp-primary-dark); border-radius:50%; opacity:0.5;
  }
  .balance-top{ display:flex; align-items:center; gap:6px; font-size:13px; color:#D9D4FF; position:relative; z-index:1;}
  .eye-btn{ background:none; border:none; color:#D9D4FF; padding:0; display:flex; cursor:pointer;}
  .balance-amount{ font-size:30px; font-weight:700; margin:8px 0 4px; letter-spacing:-0.5px; position:relative; z-index:1; font-variant-numeric:tabular-nums;}
  .balance-sub{ font-size:12.5px; color:#C9C3FF; position:relative; z-index:1;}
  .balance-sub b{ color:#fff; font-weight:600;}

  .quick-row{ display:flex; margin-top:16px; position:relative; z-index:1;}
  .quick-item{ flex:1; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; color:#fff; padding:6px 0; cursor:pointer;}
  .quick-icon{ width:42px; height:42px; border-radius:14px; background:rgba(255,255,255,0.16); display:flex; align-items:center; justify-content:center;}
  .quick-label{ font-size:11.5px; color:#EDEAFF;}

  /* spend summary */
  .section{ margin:20px 20px 0;}
  .section-title{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .section-title h3{ font-size:15px; font-weight:600; color:var(--kp-text); margin:0;}
  .section-title a{ font-size:12.5px; color:var(--kp-text-sub); text-decoration:none;}

  .spend-card{ background:var(--kp-surface); border-radius:16px; padding:16px 18px;}
  .spend-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .spend-month{ font-size:13px; color:var(--kp-text-sub);}
  .spend-total{ font-size:16px; font-weight:700; color:var(--kp-text);}
  .bars{ display:flex; align-items:flex-end; gap:6px; height:56px;}
  .bar{ flex:1; background:var(--kp-line); border-radius:5px 5px 0 0; position:relative;}
  .bar.active{ background:var(--kp-mint);}
  .bar-labels{ display:flex; gap:6px; margin-top:6px;}
  .bar-labels span{ flex:1; text-align:center; font-size:10.5px; color:var(--kp-text-faint);}

  /* transactions */
  .tx-card{ background:var(--kp-surface); border-radius:16px; overflow:hidden;}
  .tx-row{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--kp-line);}
  .tx-row:last-child{ border-bottom:none;}
  .tx-icon{ width:38px; height:38px; border-radius:12px; background:#F0EEFF; color:var(--kp-primary); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:15px; font-weight:700;}
  .tx-mid{ flex:1; min-width:0;}
  .tx-name{ font-size:14px; font-weight:500; color:var(--kp-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tx-time{ font-size:11.5px; color:var(--kp-text-sub); margin-top:2px;}
  .tx-amt{ font-size:14px; font-weight:600; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .tx-amt.minus{ color:var(--kp-text);}
  .tx-amt.plus{ color:var(--kp-mint);}

  /* bottom nav */
  .bottom-nav{
    position:absolute; left:0; right:0; bottom:0; height:78px;
    background:var(--kp-surface); border-top:1px solid var(--kp-line);
    display:flex; padding-bottom:14px;
  }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; background:none; border:none; color:var(--kp-text-faint); font-size:10.5px; cursor:pointer; padding-top:8px;}
  .nav-item.active{ color:var(--kp-primary);}
  .nav-icon{ width:22px; height:22px; display:flex; align-items:center; justify-content:center;}

  .toast{
    position:absolute; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#232436; color:#fff; font-size:12.5px; padding:10px 18px; border-radius:999px;
    opacity:0; pointer-events:none; transition:all .25s ease; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="statusbar">
    <span id="clock">9:41</span>
    <span>●●● 콩페이 ▮▮▮</span>
  </div>

  <div class="screen">
    <div class="app-header">
      <div class="greet">민준님, <span>좋은 아침이에요</span></div>
      <button class="icon-btn" onclick="showToast('알림이 없어요')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="dot"></span>
      </button>
    </div>

    <div class="balance-card">
      <div class="balance-top">
        내 콩머니 지갑
        <button class="eye-btn" id="eyeBtn" onclick="toggleBalance()">
          <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="balance-amount" id="balanceAmt">1,284,300원</div>
      <div class="balance-sub">이번 달 모은 콩 <b>+38,200원</b></div>

      <div class="quick-row">
        <button class="quick-item" onclick="showToast('송금 화면으로 이동')">
          <span class="quick-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></span>
          <span class="quick-label">송금</span>
        </button>
        <button class="quick-item" onclick="showToast('충전 화면으로 이동')">
          <span class="quick-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span>
          <span class="quick-label">충전</span>
        </button>
        <button class="quick-item" onclick="showToast('카드 화면으로 이동')">
          <span class="quick-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span>
          <span class="quick-label">카드</span>
        </button>
        <button class="quick-item" onclick="showToast('전체 메뉴')">
          <span class="quick-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>
          <span class="quick-label">전체</span>
        </button>
      </div>
    </div>

    <div class="section">
      <div class="section-title"><h3>이번 달 소비</h3><a href="#" onclick="return false;">자세히</a></div>
      <div class="spend-card">
        <div class="spend-top">
          <span class="spend-month">8월, 지금까지</span>
          <span class="spend-total">482,600원</span>
        </div>
        <div class="bars">
          <div class="bar" style="height:30%"></div>
          <div class="bar" style="height:55%"></div>
          <div class="bar" style="height:40%"></div>
          <div class="bar" style="height:70%"></div>
          <div class="bar active" style="height:90%"></div>
          <div class="bar" style="height:20%"></div>
          <div class="bar" style="height:15%"></div>
        </div>
        <div class="bar-labels"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title"><h3>최근 내역</h3><a href="#" onclick="return false;">전체보기</a></div>
      <div class="tx-card">
        <div class="tx-row">
          <div class="tx-icon">스</div>
          <div class="tx-mid"><div class="tx-name">스타벅스 강남점</div><div class="tx-time">오늘 · 08:42</div></div>
          <div class="tx-amt minus">-6,300원</div>
        </div>
        <div class="tx-row">
          <div class="tx-icon">김</div>
          <div class="tx-mid"><div class="tx-name">김서연님에게 송금</div><div class="tx-time">오늘 · 07:10</div></div>
          <div class="tx-amt minus">-30,000원</div>
        </div>
        <div class="tx-row">
          <div class="tx-icon">급</div>
          <div class="tx-mid"><div class="tx-name">8월 급여</div><div class="tx-time">어제 · 09:00</div></div>
          <div class="tx-amt plus">+2,850,000원</div>
        </div>
        <div class="tx-row">
          <div class="tx-icon">쿠</div>
          <div class="tx-mid"><div class="tx-name">쿠팡</div><div class="tx-time">어제 · 21:15</div></div>
          <div class="tx-amt minus">-18,900원</div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="bottom-nav">
      <button class="nav-item active" data-tab="home" onclick="setTab(this)">
        <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg></span>홈
      </button>
      <button class="nav-item" data-tab="assets" onclick="setTab(this)">
        <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></span>자산
      </button>
      <button class="nav-item" data-tab="perks" onclick="setTab(this)">
        <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7S9 3 6.5 3 3 5 3 6.5 5 7 12 7z"/><path d="M12 7s3-4 5.5-4S21 5 21 6.5 19 7 12 7z"/></svg></span>혜택
      </button>
      <button class="nav-item" data-tab="all" onclick="setTab(this)">
        <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>전체
      </button>
      <button class="nav-item" data-tab="my" onclick="setTab(this)">
        <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>MY
      </button>
    </div>
  </div>
</div>

<script>
  let hidden = false;
  function toggleBalance(){
    hidden = !hidden;
    document.getElementById('balanceAmt').textContent = hidden ? '••••••원' : '1,284,300원';
  }
  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 1600);
  }
  function setTab(btn){
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
    const names = {home:'홈', assets:'자산', perks:'혜택', all:'전체', my:'MY'};
    showToast(names[btn.dataset.tab] + ' 탭 (예시 화면)');
  }
  function updateClock(){
    const d = new Date();
    let h = d.getHours()%12; if(h===0) h=12;
    const m = d.getMinutes().toString().padStart(2,'0');
    document.getElementById('clock').textContent = h + ':' + m;
  }
  updateClock();
  setInterval(updateClock, 30000);
</script>
</body>
</html>
